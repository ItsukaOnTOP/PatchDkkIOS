name: Build Standalone Dylib

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"

          gh release download \
            --repo theos/sdks \
            --pattern "iPhoneOS16.5.sdk.tar.xz" \
            --dir /tmp/sdks

          tar -xf /tmp/sdks/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"

      - name: Build standalone dylib
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean
          make

      - name: Check dependencies
        run: |
          echo "=== otool -L ==="
          otool -L .theos/obj/debug/IshinRedirect.dylib

          if otool -L .theos/obj/debug/IshinRedirect.dylib | \
             grep -Eqi 'substrate|ellekit|libhooker|substitute'; then
            echo "ERROR: jailbreak hook runtime dependency detected"
            exit 1
          fi

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: IshinRedirect-standalone
          path: .theos/obj/debug/IshinRedirect.dylib
          if-no-files-found: error
